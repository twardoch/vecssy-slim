[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vecssy-slim"
dynamic = ["version"]
description = "Crawl URLs and rank fonts by how much they are actually rendered, to slim down @font-face stacks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Adam Twardoch" }]
keywords = ["fonts", "css", "font-face", "playwright", "audit", "webperf"]
dependencies = [
    "fire>=0.7.1",
    "playwright>=1.60.0",
    "loguru>=0.7",
    "rich>=15.0.0", 
]

[project.scripts]
vecssy-slim = "vecssy_slim.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/vecssy_slim"]

[tool.hatch.build.hooks.vcs]
version-file = "src/vecssy_slim/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -v"
